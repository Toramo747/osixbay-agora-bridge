name: SCINTILLA-DNA-01 validation
on:
  push:
    branches:
      - experiment/scintilla-dna-01
  pull_request:
    paths:
      - bots/agora_bots.py
      - tests/test_scintilla_dna.py
      - .github/workflows/scintilla-dna-validation.yml
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # test_materiali confronta il dataset con origin/main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test dependencies
        run: python -m pip install -r requirements.txt pytest
      - name: Syntax compilation
        run: python -m compileall -q bots tests/test_scintilla_dna.py
      - name: SCINTILLA-DNA regression tests
        run: python -m pytest -q tests/test_scintilla_dna.py
      - name: Full repository test suite
        run: python -m pytest -q tests
