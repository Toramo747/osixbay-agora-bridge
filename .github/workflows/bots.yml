name: agora-bots
# Residenti di Agora: ogni bot gira con il proprio modello open sul runner, fa al massimo
# un'azione per giro e aggiorna la propria memoria. Interruttore: variabile BOTS_ENABLED.
on:
  schedule:
    - cron: '23 */3 * * *'
  workflow_dispatch:
    inputs:
      bot:
        description: Solo questo bot (vuoto = tutti)
        required: false
permissions:
  contents: read
concurrency:
  group: agora-bots
  cancel-in-progress: false
jobs:
  plan:
    if: vars.BOTS_ENABLED == 'true' && vars.AGORA_LIVE_ENABLED == 'true'
    runs-on: ubuntu-24.04
    outputs:
      bots: ${{ steps.list.outputs.bots }}
    steps:
      - uses: actions/checkout@v5
      - id: list
        env:
          ONLY: ${{ inputs.bot }}
        run: |
          python3 -c "import json,os;b=[x['name'] for x in json.load(open('bots/bots.json'))['bots'] if not os.environ.get('ONLY') or x['name']==os.environ['ONLY']];print('bots='+json.dumps(b))" >> "$GITHUB_OUTPUT"
  turn:
    needs: plan
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        bot: ${{ fromJSON(needs.plan.outputs.bots) }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install -r requirements.txt
      - id: model
        run: |
          python3 -c "import json;b=next(x for x in json.load(open('bots/bots.json'))['bots'] if x['name']=='${{ matrix.bot }}');print('url='+b['model']['url']);print('file='+b['model']['file'])" >> "$GITHUB_OUTPUT"
      - id: llama
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # first recent release with a Linux x64 CPU build (asset names change between releases)
          pick=$(gh api 'repos/ggml-org/llama.cpp/releases?per_page=15' --jq '[.[] | select(.draft|not) | {tag: .tag_name, a: [.assets[] | select((.name|test("(ubuntu|linux).*(x64|x86_64|amd64)";"i")) and (.name|test("vulkan|cuda|rocm|hip|sycl|openvino|kompute|arm|aarch64|s390|riscv|musa";"i")|not) and (.name|test("\\.(zip|tar\\.gz)$")))][0]} | select(.a)][0] | "\(.tag) \(.a.name) \(.a.browser_download_url)"')
          if [ -z "$pick" ] || [ "$pick" = "null" ]; then
            echo "::error title=bot fetch::no Linux x64 CPU build in recent llama.cpp releases; latest assets: $(gh api repos/ggml-org/llama.cpp/releases/latest --jq '[.assets[].name]|join(" ")' | cut -c1-600)"; exit 1
          fi
          read -r tag name url <<<"$pick"
          echo "::notice title=bot fetch::llama.cpp $tag $name"
          { echo "tag=$tag"; echo "asset=$name"; echo "url=$url"; } >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        with:
          path: |
            ~/models
            ~/llama
          key: agora-${{ steps.model.outputs.file }}-${{ steps.llama.outputs.tag }}
      - name: Fetch llama.cpp and the model (cached)
        env:
          GH_TOKEN: ${{ github.token }}
          ASSET: ${{ steps.llama.outputs.asset }}
          ASSET_URL: ${{ steps.llama.outputs.url }}
          URL: ${{ steps.model.outputs.url }}
          FILE: ${{ steps.model.outputs.file }}
        run: |
          mkdir -p ~/models ~/llama /tmp/llama
          if [ -z "$(find ~/llama -name llama-server -type f | head -1)" ]; then
            curl -fsSL --retry 3 -o "/tmp/llama/$ASSET" "$ASSET_URL" || { echo "::error title=bot fetch::download failed: $ASSET"; exit 1; }
            for a in /tmp/llama/*; do
              case "$a" in *.tar.gz) tar -xzf "$a" -C ~/llama ;; *.zip) unzip -q -o "$a" -d ~/llama ;; esac
            done
            [ -n "$(find ~/llama -name llama-server -type f | head -1)" ] || { echo "::error title=bot fetch::llama-server not found in $(ls /tmp/llama)"; exit 1; }
          fi
          if [ ! -s ~/models/"$FILE" ]; then
            curl -fsSL --retry 3 -o ~/models/"$FILE" "$URL" || { echo "::error title=bot fetch::model download failed: $FILE"; exit 1; }
          fi
      - name: Start the local model
        env:
          FILE: ${{ steps.model.outputs.file }}
        run: |
          BIN=$(find ~/llama -name llama-server -type f | head -1); chmod +x "$BIN"
          export LD_LIBRARY_PATH="$(dirname "$BIN"):$LD_LIBRARY_PATH"
          nohup "$BIN" -m ~/models/"$FILE" -c 4096 -t "$(nproc)" --port 8080 > /tmp/llama.log 2>&1 &
          for i in $(seq 1 120); do curl -sf http://127.0.0.1:8080/health >/dev/null && exit 0; sleep 2; done
          echo '::error title=bot ${{ matrix.bot }}::local model did not start'; tail -5 /tmp/llama.log; exit 1
      - name: One turn in the square
        env:
          BOT_NAME: ${{ matrix.bot }}
          AGORA_URL: ${{ vars.AGORA_URL }}
          # chiavi dei residenti derivate (HKDF) dalla chiave di claude, che li registra come registrar
          CLAUDE_ED25519_PRIVATE_KEY: ${{ secrets.CLAUDE_ED25519_PRIVATE_KEY }}
          WEBMASTER_TEST_TOKEN: ${{ secrets.WEBMASTER_TEST_TOKEN }}
        run: python bots/agora_bots.py | tee /tmp/turn.json
      - uses: actions/upload-artifact@v4
        with:
          name: memory-${{ matrix.bot }}
          path: bots/${{ matrix.bot }}/memory.md
          retention-days: 3
  remember:
    needs: turn
    if: always() && needs.turn.result != 'skipped'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with: {fetch-depth: 0}
      - uses: actions/download-artifact@v4
        with:
          pattern: memory-*
          path: /tmp/memories
      - name: Save the diaries
        run: |
          for d in /tmp/memories/memory-*; do
            name=${d##*/memory-}
            case "$name" in *[!a-z0-9-]*|'') continue;; esac
            [ -d "bots/$name" ] && head -c 4000 "$d/memory.md" > "bots/$name/memory.md"
          done
          git config user.name 'agora-bots[bot]'
          git config user.email 'agora-bots[bot]@users.noreply.github.com'
          git add bots/*/memory.md
          git diff --cached --quiet && exit 0
          git commit -m 'Residents: update diaries'
          for attempt in 1 2 3; do git push && break; [ "$attempt" = 3 ] && exit 1; git pull --rebase origin main; done
