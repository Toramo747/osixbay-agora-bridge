name: gple-f01-kaggle-laboratory
on:
  push:
    branches:
      - feature/gple-f01-kaggle-lab
    paths:
      - 'gple_f01/**'
      - '.github/workflows/gple-f01-kaggle.yml'
  workflow_dispatch:
    inputs:
      run_kaggle:
        description: 'Submit private Kaggle notebook (true); false = GitHub CPU baseline only'
        type: boolean
        required: true
        default: false
permissions:
  contents: read
concurrency:
  group: gple-f01-kaggle-laboratory
  cancel-in-progress: false
jobs:
  baseline:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 3c79e0aa949cfcc985cb25ff322c008a881f1a72
      - name: Checkout habitat validators from this laboratory branch
        uses: actions/checkout@v4
        with:
          path: lab
          ref: feature/gple-f01-kaggle-lab
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Unit tests
        run: python -m unittest discover -s genesis/fauna01/tests -v
      - name: Habitat import validator tests
        run: python -m unittest discover -s lab/gple_f01 -p 'test_habitat_validator.py' -v
      - name: Multi-seed biome proposal tests
        run: python -m unittest discover -s lab/gple_f01 -p 'test_biome_search.py' -v
      - name: Evolutionary biome hypothesis tests
        run: python -m unittest discover -s lab/gple_f01 -p 'test_evolve_biomes.py' -v
      - name: Specialist review tests
        run: python -m unittest discover -s lab/gple_f01 -p 'test_specialist_review.py' -v
      - name: Biome-specific ecological adapter tests
        run: python -m unittest discover -s lab/gple_f01 -p 'test_ecological_adapter.py' -v
      - name: Long-horizon ecology tests
        run: python -m unittest discover -s lab/gple_f01 -p 'test_long_horizon.py' -v
      - name: Extinction counterfactual tests
        run: python -m unittest discover -s lab/gple_f01 -p 'test_counterfactuals.py' -v
      - name: Godot 2.5D world contract tests
        run: python -m unittest discover -s lab/gple_f01 -p 'test_world25d.py' -v
      - name: Ecological food web tests
        run: python -m unittest discover -s lab/gple_f01 -p 'test_foodweb_p0.py' -v
      - name: Offline 2.5D asset/event contract tests
        run: python -m unittest discover -s lab/gple_f01 -p 'test_asset_contract_p0.py' -v
      - name: Connected eco-patch conservation and snapshot tests
        run: python -m unittest discover -s lab/gple_f01 -p 'test_multi_patch_p0.py' -v
      - name: Synthetic hydrology conservation and replay tests
        run: python -m unittest discover -s lab/gple_f01 -p 'test_hydrology_p0.py' -v
      - name: Plant water uptake and transpiration conservation tests
        run: python -m unittest discover -s lab/gple_f01 -p 'test_producer_hydration_p0.py' -v
      - name: Individual plant lifecycles and conservation tests
        run: python -m unittest discover -s lab/gple_f01 -p 'test_plant_lifecycle_p0.py' -v
      - name: Plant genetics inheritance and selection tests
        run: python -m unittest discover -s lab/gple_f01 -p 'test_plant_genetics_p0.py' -v
      - name: Original Python/JS parity
        run: node --test genesis/fauna01/tests/test_parity.mjs
      - name: Original F01 baseline
        run: |
          mkdir -p out
          python genesis/fauna01/sim.py > out/f01-original-reference.json
          python lab/gple_f01/biome_search.py --original genesis/fauna01/sim.py --ticks 150 --out out/f01-biome-proposals.json
          python lab/gple_f01/evolve_biomes.py --original genesis/fauna01/sim.py --generations 3 --out out/f01-generated-biomes.json
          python lab/gple_f01/specialist_review.py --input out/f01-generated-biomes.json --out out/f01-specialist-review.json
          python lab/gple_f01/compare_ecology.py --original genesis/fauna01/sim.py --ticks 120 --out out/f01-ecological-comparison.json
          python lab/gple_f01/long_horizon.py --original genesis/fauna01/sim.py --ticks 1500 --out out/f01-endurance.json
          python lab/gple_f01/counterfactuals.py --original genesis/fauna01/sim.py --ticks 400 --out out/f01-counterfactuals.json
          python lab/gple_f01/asset_contract_p0.py > out/f01-asset-manifest-p0.json
          PYTHONPATH=lab/gple_f01 python -c 'import json; from pathlib import Path; from multi_patch_p0 import experiment; Path("out/f01-multi-patch-p0.json").write_text(json.dumps(experiment(ticks=500),indent=2,sort_keys=True))'
          PYTHONPATH=lab/gple_f01 python -c 'import json; from pathlib import Path; from hydrology_p0 import experiment; Path("out/f01-hydrology-p0.json").write_text(json.dumps(experiment(ticks=600),indent=2,sort_keys=True))'
          PYTHONPATH=lab/gple_f01 python -c 'import json; from pathlib import Path; from producer_hydration_p0 import experiment; Path("out/f01-producer-water-p0.json").write_text(json.dumps(experiment(ticks=400),indent=2,sort_keys=True))'
          PYTHONPATH=lab/gple_f01 python -c 'import json; from pathlib import Path; from plant_lifecycle_p0 import experiment; Path("out/f01-plant-life-p0.json").write_text(json.dumps(experiment(ticks=400),indent=2,sort_keys=True))'
          PYTHONPATH=lab/gple_f01 python -c 'import json; from pathlib import Path; from plant_genetics_p0 import experiment; Path("out/f01-plant-genetics-p0.json").write_text(json.dumps(experiment(ticks=350),indent=2,sort_keys=True))'
          PYTHONPATH=lab/gple_f01 python -c 'from foodweb_p0 import experiment; import json; from pathlib import Path; Path("out/f01-foodweb-p0.json").write_text(json.dumps(experiment(ticks=300),indent=2,sort_keys=True))'
      - uses: actions/upload-artifact@v4
        with:
          name: gple-f01-cpu-baseline
          path: out/
          retention-days: 30
      - name: Submit to Kaggle only if explicitly requested
        if: inputs.run_kaggle == true
        env:
          KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
          KAGGLE_KEY: ${{ secrets.KAGGLE_KEY }}
        run: |
          set -eu
          test -n "$KAGGLE_USERNAME"
          if [ -z "$KAGGLE_API_TOKEN" ]; then
            test -n "$KAGGLE_KEY"
            export KAGGLE_API_TOKEN="$KAGGLE_KEY"
          fi
          python -m pip install 'kaggle>=1.7.4'
          mkdir -p /tmp/gple-kernel
          cp genesis/fauna01/sim.py /tmp/gple-kernel/sim.py
          cp lab/gple_f01/biome_search.py /tmp/gple-kernel/biome_search.py
          cp lab/gple_f01/evolve_biomes.py /tmp/gple-kernel/evolve_biomes.py
          cp lab/gple_f01/specialist_review.py /tmp/gple-kernel/specialist_review.py
          cp lab/gple_f01/ecological_adapter.py /tmp/gple-kernel/ecological_adapter.py
          cp lab/gple_f01/compare_ecology.py /tmp/gple-kernel/compare_ecology.py
          cp lab/gple_f01/long_horizon.py /tmp/gple-kernel/long_horizon.py
          cp lab/gple_f01/counterfactuals.py /tmp/gple-kernel/counterfactuals.py
          cat > /tmp/gple-kernel/main.py <<'PY'
          from sim import demonstration
          from biome_search import experiment
          from evolve_biomes import evolve
          from specialist_review import review
          from ecological_adapter import compare
          from long_horizon import endurance
          from counterfactuals import experiment as counterfactual_experiment
          from biome_search import VARIANTS
          from pathlib import Path
          import json
          base=Path("/kaggle/working")
          base.joinpath("f01-metrics.json").write_text(json.dumps(demonstration(seed=13,ticks=80),indent=2,sort_keys=True))
          result=experiment(base/"sim.py",ticks=150)
          base.joinpath("f01-biome-proposals.json").write_text(json.dumps(result,indent=2,sort_keys=True))
          generated=evolve(base/"sim.py",seed=2026,generations=3)
          base.joinpath("f01-generated-biomes.json").write_text(json.dumps(generated,indent=2,sort_keys=True))
          base.joinpath("f01-specialist-review.json").write_text(json.dumps(review(generated),indent=2,sort_keys=True))
          ecological=compare(base/"sim.py",VARIANTS,ticks=120)
          base.joinpath("f01-ecological-comparison.json").write_text(json.dumps(ecological,indent=2,sort_keys=True))
          long_result=endurance(base/"sim.py",ticks=1500)
          base.joinpath("f01-endurance.json").write_text(json.dumps(long_result,indent=2,sort_keys=True))
          diagnoses=counterfactual_experiment(base/"sim.py",ticks=400)
          base.joinpath("f01-counterfactuals.json").write_text(json.dumps(diagnoses,indent=2,sort_keys=True))
          print("Synthetic F01 candidate count",len(result["proposals"]))
          print("Top screening hypothesis",result["proposals"][0]["candidate"]["id"])
          PY
          python - <<'PY'
          import json,os
          username=os.environ["KAGGLE_USERNAME"]
          data={"id":username+"/osixbay-gple-f01-lab","title":"OSIXBAY Genesis F01 private laboratory",
                "code_file":"main.py","language":"python","kernel_type":"script",
                "is_private":True,"enable_gpu":False,"enable_internet":False,
                "dataset_sources":[],"competition_sources":[],"kernel_sources":[]}
          with open("/tmp/gple-kernel/kernel-metadata.json","w") as f: json.dump(data,f)
          PY
          kaggle kernels push -p /tmp/gple-kernel
          echo "Submission requested; inspect Kaggle kernel execution status and output separately."
