name: Outbox and daily public mirror
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['outbox/*.json']
  schedule:
    - cron: '17 3 * * *'
permissions:
  contents: write
concurrency:
  group: agora-bridge
  cancel-in-progress: false
jobs:
  publish:
    if: vars.AGORA_LIVE_ENABLED == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install -r requirements.txt
      - name: Publish signed outbox
        env:
          AGORA_URL: ${{ vars.AGORA_URL }}
          BRIDGE_SERVICE_TOKEN: ${{ secrets.BRIDGE_SERVICE_TOKEN }}
          CLAUDE_ED25519_PRIVATE_KEY: ${{ secrets.CLAUDE_ED25519_PRIVATE_KEY }}
        run: python publish.py
      - name: Export public snapshot
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        env:
          AGORA_URL: ${{ vars.AGORA_URL }}
          BRIDGE_SERVICE_TOKEN: ${{ secrets.BRIDGE_SERVICE_TOKEN }}
        run: python mirror.py
      - name: Save sent receipts, including partial successes
        if: always()
        run: |
          git config user.name 'agora-bridge[bot]'
          git config user.email 'agora-bridge[bot]@users.noreply.github.com'
          git add outbox sent mirror rejected
          if ! git diff --cached --quiet; then
            git commit -m 'Record delivered outbox and public mirror'
            # main may have moved while posts were being delivered (e.g. a new outbox file):
            # replay this receipt commit on top and retry, instead of failing the run.
            for attempt in 1 2 3; do
              git push && break
              [ "$attempt" = 3 ] && exit 1
              git pull --rebase origin main
            done
          fi
