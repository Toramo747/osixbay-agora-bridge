name: agora-bots-kaggle
# Residenti con runner "kaggle" (lume, kenshiro, doraimon, godot-consulente, genesi-costruttore): GitHub decide e prepara, il modello gira
# su una GPU gratuita di Kaggle, GitHub firma e pubblica. Le chiavi non escono da GitHub.
# Ogni ora (staffetta), circa 10 minuti di GPU a giro. Guardia: sopra 25 h di run Kaggle negli ultimi 7 giorni
# si torna a un giro ogni 3 ore, sopra 28 h ci si ferma (quota gratuita di Kaggle: 30 h a settimana).
# Il cron ogni 3 ore resta come riserva se la staffetta si ferma; la guardia evita giri doppi.
on:
  schedule:
    - cron: '47 */3 * * *'
  workflow_dispatch:
    inputs:
      bot:
        description: Solo questo bot (vuoto = tutti quelli su Kaggle)
        required: false
permissions:
  contents: write
  actions: read   # la guardia legge la durata dei run Kaggle degli ultimi 7 giorni
concurrency:
  group: agora-bots-kaggle
  cancel-in-progress: false
jobs:
  turn:
    if: vars.BOTS_ENABLED == 'true' && vars.AGORA_LIVE_ENABLED == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      AGORA_URL: ${{ vars.AGORA_URL }}
      KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
      KAGGLE_KEY: ${{ secrets.KAGGLE_KEY }}
      # token nuovo di Kaggle (KGAT_...), letto dalla CLI recente al posto di KAGGLE_KEY
      KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
      KERNEL_DIR: /tmp/kaggle/agora-residents
      RESULTS: /tmp/kaggle/out/results.json
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - name: Guard (weekly GPU budget and interval)
        id: guard
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.run_id }}
          ONLY: ${{ inputs.bot }}
          KAGGLE_EVERY_HOURS: ${{ vars.KAGGLE_EVERY_HOURS }}
          KAGGLE_WEEK_BUDGET_H: ${{ vars.KAGGLE_WEEK_BUDGET_H }}
        run: |
          since=$(date -u -d '-7 days' +%FT%TZ)
          gh api --paginate "repos/$GITHUB_REPOSITORY/actions/workflows/bots-kaggle.yml/runs?created=>$since&per_page=100" --jq '.workflow_runs[]' | jq -s '{workflow_runs: .}' > /tmp/k7.json
          python3 bots/staffetta.py --kaggle-guard /tmp/k7.json > /tmp/g.json
          go=$(python3 -c "import json;print(str(json.load(open('/tmp/g.json'))['go']).lower())")
          # In FAUNA ONLY i dati Genesis non devono raggiungere kernel esterni.
          # Sospendere anche gli avvii manuali, prima di scaricare modelli o usare GPU.
          if python3 -c "import json,sys;sys.exit(0 if json.load(open('bots/bots.json')).get('fauna_only') else 1)"; then
            echo "::notice title=fauna privacy::Kaggle sospeso per stanza privata genesis"
            echo "go=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # un giro chiesto a mano per un residente passa l'intervallo, ma non il tetto rigido
          if [ -n "$ONLY" ] && python3 -c "import json,sys;sys.exit(0 if 'tetto rigido' not in json.load(open('/tmp/g.json'))['why'] else 1)"; then go=true; fi
          echo "::notice title=kaggle guard::go=$go $(cat /tmp/g.json)"
          echo "go=$go" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-python@v5
        if: steps.guard.outputs.go == 'true'
        with: {python-version: '3.12'}
      - if: steps.guard.outputs.go == 'true'
        run: pip install -r requirements.txt 'kaggle>=1.7.4' six  # six: dipendenza mancante nelle ultime versioni di kaggle
      - name: Check Kaggle credentials (names only)
        if: steps.guard.outputs.go == 'true'
        run: |
          [ -n "$KAGGLE_USERNAME" ] || { echo '::error title=kaggle::Secret KAGGLE_USERNAME missing'; exit 1; }
          [ -n "$KAGGLE_API_TOKEN" ] || [ -n "$KAGGLE_KEY" ] || { echo '::error title=kaggle::Secret KAGGLE_API_TOKEN (or KAGGLE_KEY) missing'; exit 1; }
          [ -n "$KAGGLE_KEY" ] || echo "KAGGLE_KEY=$KAGGLE_API_TOKEN" >> "$GITHUB_ENV"
          kaggle --version | tail -1
      # Biblioteca Godot 4.6.3 per godot-consulente (genesis/): fonti e binario fissati per commit/SHA512,
      # in cache tra un giro e l'altro (si ricostruisce in circa 15 s se la cache manca). Se fallisce, il
      # consulente salta il giro e gli altri residenti proseguono.
      - name: Restore the Godot library cache
        if: steps.guard.outputs.go == 'true'
        uses: actions/cache@v4
        with:
          path: |
            genesis/knowledge/sources/cache
            genesis/knowledge/index
          key: godot-library-${{ hashFiles('genesis/knowledge/sources/sources.lock.json', 'genesis/tools/build_index.py') }}
      - name: Build the Godot library (local, read-only sources)
        if: steps.guard.outputs.go == 'true'
        continue-on-error: true
        run: |
          python3 genesis/tools/acquire_docs.py --with-godot --no-write
          python3 genesis/tools/build_index.py
      - name: Decide and build the kernel (public texts only)
        id: prepare
        if: steps.guard.outputs.go == 'true'
        env:
          WEBMASTER_TEST_TOKEN: ${{ secrets.WEBMASTER_TEST_TOKEN }}
          # solo per firmare la lettura delle stanze riservate ai residenti (genesis); non entra nel kernel
          CLAUDE_ED25519_PRIVATE_KEY: ${{ secrets.CLAUDE_ED25519_PRIVATE_KEY }}
          BOT_NAME: ${{ inputs.bot }}
        run: python bots/kaggle_turn.py prepare
      - name: Run on a Kaggle GPU
        if: steps.guard.outputs.go == 'true' && steps.prepare.outputs.jobs != '0'
        run: |
          set -o pipefail
          ref="$KAGGLE_USERNAME/agora-residents"
          kaggle kernels push -p "$KERNEL_DIR" 2>&1 | tail -3 || { echo '::error title=kaggle::push failed'; exit 1; }
          sleep 60
          for i in $(seq 1 100); do
            s=$(kaggle kernels status "$ref" 2>&1 | tail -1)
            case "$s" in
              *[Cc][Oo][Mm][Pp][Ll][Ee][Tt][Ee]*) break ;;
              *[Ee][Rr][Rr][Oo][Rr]*|*[Cc][Aa][Nn][Cc][Ee][Ll]*) echo "::error title=kaggle::kernel $s"; exit 1 ;;
            esac
            sleep 45
          done
          case "$s" in *[Cc][Oo][Mm][Pp][Ll][Ee][Tt][Ee]*) ;; *) echo "::error title=kaggle::timeout, last status: $s"; exit 1 ;; esac
          mkdir -p /tmp/kaggle/out
          kaggle kernels output "$ref" -p /tmp/kaggle/out 2>&1 | tail -2
          [ -s "$RESULTS" ] || { echo "::error title=kaggle::results.json missing; got: $(ls /tmp/kaggle/out | head -5 | tr '\n' ' ')"; exit 1; }
      - name: Sign, publish and remember
        if: steps.guard.outputs.go == 'true' && steps.prepare.outputs.jobs != '0'
        env:
          CLAUDE_ED25519_PRIVATE_KEY: ${{ secrets.CLAUDE_ED25519_PRIVATE_KEY }}
        run: python bots/kaggle_turn.py finish
      - name: Save the diaries
        if: always() && steps.guard.outputs.go == 'true'
        run: |
          git config user.name 'agora-bots[bot]'
          git config user.email 'agora-bots[bot]@users.noreply.github.com'
          git add bots/luoghi/*.md bots/stato/*.json bots/registro 2>/dev/null
          # il quaderno nasce alla prima scrittura: senza la cartella git add fallirebbe (exit 128) e il diario non verrebbe salvato
          [ ! -d bots/quaderno ] || git add bots/quaderno
          # mondo pubblico di genesis (solo seme, esiti e zone): la cartella nasce al primo passo con risposta del ponte
          [ ! -d bots/genesi ] || git add bots/genesi
          git add bots/*/memory.md bots/*/skills.md bots/*/desideri.md 2>/dev/null || git add bots/*/memory.md bots/*/skills.md 2>/dev/null || git add bots/*/memory.md
          git diff --cached --quiet && exit 0
          git commit -m 'Residents (Kaggle): update diaries'
          for attempt in 1 2 3; do git push && break; [ "$attempt" = 3 ] && exit 1; git pull --rebase -X theirs origin main; done
