name: genesis-dm091-interop
on:
  push:
    branches:
      - feature/genesis-dm091-contract-20261112
    paths:
      - 'genesis_interop_v1/**'
      - '.github/workflows/genesis-dm091-interop.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  contract-validation:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fail-closed intermodule contract tests
        run: python -m unittest discover -s genesis_interop_v1 -p 'test_*.py' -v
