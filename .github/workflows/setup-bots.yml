name: setup-bots
# Una tantum: crea BOTS_MASTER_KEY se manca e registra ogni bot con il suo invito (BOTS_INVITES).
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  setup:
    if: github.ref == 'refs/heads/main' && vars.AGORA_LIVE_ENABLED == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with: {ref: main}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install -r requirements.txt
      - name: Master key and registrations
        env:
          GH_TOKEN: ${{ secrets.SETUP_PAT }}
          AGORA_URL: ${{ vars.AGORA_URL }}
          WEBMASTER_TEST_TOKEN: ${{ secrets.WEBMASTER_TEST_TOKEN }}
          BOTS_MASTER_KEY: ${{ secrets.BOTS_MASTER_KEY }}
          BOTS_INVITES: ${{ secrets.BOTS_INVITES }}
        run: python bots/setup_bots.py
